networks:
  shared_network:
    external: true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command: >
      --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE}
      --max-connections=${MYSQL_MAX_CONNECTIONS}
      ${MYSQL_DISABLE_BINLOG:+--skip-log-bin}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - shared_network

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    logging: *default-logging
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:8585:80"
    networks:
      - shared_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:9090:80"
    networks:
      - shared_network

  # nginx-proxy-manager:
  #   image: jc21/nginx-proxy-manager:latest
  #   container_name: nginx-proxy-manager
  #   restart: unless-stopped
  #   logging: *default-logging
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "127.0.0.1:81:81"
  #   volumes:
  #     - npm_data:/data
  #     - npm_letsencrypt:/etc/letsencrypt
  #   networks:
  #     - shared_network

  typesense:
    image: typesense/typesense:27.1
    container_name: typesense
    restart: unless-stopped
    logging: *default-logging
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data
    ports:
      - "127.0.0.1:8108:8108"
    networks:
      - shared_network

  typesense-dashboard:
    image: bfritscher/typesense-dashboard
    container_name: typesense-dashboard
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - typesense
    ports:
      - "127.0.0.1:8109:80"
    networks:
      - shared_network

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - shared_network

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - shared_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
      HTTP_USER: ${REDIS_COMMANDER_USER}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD}
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8082:8081"
    networks:
      - shared_network

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - shared_network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: unless-stopped
    logging: *default-logging
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8083:8081"
    networks:
      - shared_network

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8686:8080"
    networks:
      - shared_network

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - shared_network

volumes:
  mysql_data:
    name: mysql_data
  # npm_data:
  #   name: npm_data
  # npm_letsencrypt:
  #   name: npm_letsencrypt
  typesense_data:
    name: typesense_data
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data
  pgadmin_data:
    name: pgadmin_data
  mongo_data:
    name: mongo_data
  minio_data:
    name: minio_data
